name: Publish to npm

on:
    push:
        tags:
            - 'v*'
            - 'chain-v*'
    workflow_dispatch:
        inputs:
            package:
                description: Package to publish
                required: true
                type: choice
                default: all
                options:
                    - all
                    - core
                    - control-ui
                    - stompbox
                    - visual-effects
                    - amp
                    - cabinet
                    - chain

permissions:
    contents: read
    id-token: write

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.2.2

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  scope: '@vessel-dsp'

            - run: bun install --frozen-lockfile

            - name: Verify all packages
              if: github.event_name == 'workflow_dispatch' && inputs.package == 'all'
              run: bun run pack:dry-run

            - name: Verify core package
              if: startsWith(github.ref, 'refs/tags/v') || inputs.package == 'core'
              run: bun run --cwd packages/core pack:dry-run

            - name: Verify control-ui package
              if: github.event_name == 'workflow_dispatch' && inputs.package == 'control-ui'
              run: bun run --cwd packages/control-ui pack:dry-run

            - name: Verify stompbox package
              if: github.event_name == 'workflow_dispatch' && inputs.package == 'stompbox'
              run: bun run --cwd packages/stompbox pack:dry-run

            - name: Verify visual-effects package
              if: github.event_name == 'workflow_dispatch' && inputs.package == 'visual-effects'
              run: bun run --cwd packages/visual-effects pack:dry-run

            - name: Verify amp package
              if: github.event_name == 'workflow_dispatch' && inputs.package == 'amp'
              run: bun run --cwd packages/amp pack:dry-run

            - name: Verify cabinet package
              if: github.event_name == 'workflow_dispatch' && inputs.package == 'cabinet'
              run: bun run --cwd packages/cabinet pack:dry-run

            - name: Verify chain tag matches the package version
              if: startsWith(github.ref, 'refs/tags/chain-v')
              run: |
                  expected="chain-v$(node -p "require('./packages/chain/package.json').version")"
                  test "$expected" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} does not match packages/chain/package.json ($expected)"; exit 1; }

            - name: Verify chain's @vessel-dsp dependencies are published
              if: startsWith(github.ref, 'refs/tags/chain-v') || inputs.package == 'chain'
              run: |
                  # chain pins its @vessel-dsp dependencies exactly. Publishing it while one is
                  # missing from npm ships a package nobody can install, and a published version
                  # cannot be reused. Remove this step only on purpose.
                  node -e "const d=require('./packages/chain/package.json').dependencies;for(const [n,v] of Object.entries(d))if(n.startsWith('@vessel-dsp/'))console.log(n+'@'+v)" | while read dep; do
                      npm view "$dep" version >/dev/null 2>&1 || { echo "::error::$dep is not published on npm; refusing to publish chain"; exit 1; }
                  done

            - name: Verify chain package
              if: startsWith(github.ref, 'refs/tags/chain-v') || inputs.package == 'chain'
              run: bun run --cwd packages/chain pack:dry-run

            - name: Publish core package
              if: startsWith(github.ref, 'refs/tags/v') || inputs.package == 'all' || inputs.package == 'core'
              run: npm publish --workspace @vessel-dsp/core --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish control-ui package
              if: inputs.package == 'all' || inputs.package == 'control-ui'
              run: npm publish --workspace @vessel-dsp/control-ui --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish stompbox package
              if: inputs.package == 'all' || inputs.package == 'stompbox'
              run: npm publish --workspace @vessel-dsp/stompbox --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish visual-effects package
              if: inputs.package == 'all' || inputs.package == 'visual-effects'
              run: npm publish --workspace @vessel-dsp/visual-effects --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish amp package
              if: inputs.package == 'all' || inputs.package == 'amp'
              run: npm publish --workspace @vessel-dsp/amp --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish cabinet package
              if: inputs.package == 'all' || inputs.package == 'cabinet'
              run: npm publish --workspace @vessel-dsp/cabinet --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish chain package
              if: startsWith(github.ref, 'refs/tags/chain-v') || inputs.package == 'chain'
              run: npm publish --workspace @vessel-dsp/chain --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
